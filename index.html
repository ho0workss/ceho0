<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>마켓 인사이트 — S&P 500에 도전하는 정직한 투자 대시보드</title>
  <meta name="description" content="S&P 500을 이기는 것을 목표로 하는 전략 포트폴리오와 매일 갱신되는 기간별 추천. 모든 수치는 확률로 정직하게, 성적은 전부 공개.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="viz-root">
  <div class="wrap">

    <header class="site">
      <div class="topbar">
        <h1>📊 마켓 인사이트</h1>
        <div class="topctrl">
          <button type="button" id="refreshbtn" class="btn ghost">🔄 새 추천 받기</button>
          <label class="easytgl" title="어려운 용어를 쉬운 말로 풀어 줘요">
            <input type="checkbox" id="easymode" checked>
            <span>쉬운 설명</span>
          </label>
        </div>
      </div>
      <p class="sub">S&amp;P 500에 도전하는 전략 포트폴리오 + 매일 갱신 추천 — 모든 수치는 <b>확률</b>이고, 성적은 <b>전부 공개</b>합니다</p>
      <span class="asof" id="asof"></span>
    </header>

    <nav class="tabs" id="tabs" aria-label="메뉴">
      <button type="button" data-tab="today" aria-selected="true">🏠 오늘</button>
      <button type="button" data-tab="race" aria-selected="false">🏁 vs S&amp;P 500</button>
      <button type="button" data-tab="picks" aria-selected="false">📋 추천 전체</button>
      <button type="button" data-tab="records" aria-selected="false">📊 성적표</button>
      <button type="button" data-tab="help" aria-selected="false">❓ 배우기</button>
    </nav>

    <main>
      <section id="view-today"></section>
      <section id="view-race" hidden></section>
      <section id="view-picks" hidden></section>
      <section id="view-records" hidden></section>
      <section id="view-help" hidden></section>
    </main>

    <footer class="disclaimer">
      본 서비스는 정보 제공 목적의 시뮬레이션 도구이며 투자 자문이 아닙니다. 모든 수치는 몬테카를로 시뮬레이션(20,000 경로)에 기반한
      <b>확률 추정치</b>로, 실제 수익을 보장하지 않습니다. 원금 손실이 발생할 수 있으며 투자 판단과 책임은 투자자 본인에게 있습니다.
    </footer>
  </div>

  <div class="backdrop" id="backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <script src="data.js"></script>
  <script src="data/sim.js"></script>
  <script src="data/strategy.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
